apiVersion: v1
kind: Namespace
metadata:
  name: interviewmirror
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-backend-deployment
  namespace: interviewmirror
  labels:
    app: express-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: express-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: express-backend
    spec:
      containers:
        - name: express-backend
          image: interviewmirror/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: db-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: express-backend-service
  namespace: interviewmirror
spec:
  type: ClusterIP
  selector:
    app: express-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-ai-deployment
  namespace: interviewmirror
  labels:
    app: fastapi-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-ai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fastapi-ai
    spec:
      containers:
        - name: fastapi-ai
          image: interviewmirror/ai-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: openai-key
          resources:
            requests:
              cpu: "500m"
              memory: "1024Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 25
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-ai-service
  namespace: interviewmirror
spec:
  type: ClusterIP
  selector:
    app: fastapi-ai
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interviewmirror-ingress
  namespace: interviewmirror
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    nginx.ingress.kubernetes.io/websocket-services: "express-backend-service"
spec:
  rules:
    - host: api.interviewmirror.com
      http:
        paths:
          - path: /api/v1/analyze
            pathType: Prefix
            backend:
              service:
                name: fastapi-ai-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: express-backend-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: express-backend-hpa
  namespace: interviewmirror
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: express-backend-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
