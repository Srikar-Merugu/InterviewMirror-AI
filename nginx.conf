user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Production Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Suppress version disclosure

    # Gzip Compression Rules
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting: 30 requests per minute per IP for sensitive auth/analysis endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    # Global connection limit
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Map WebSockets header upgrades
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream clusters for internal scaling
    upstream express_backend {
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream ai_engine {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Client request restrictions
        client_max_body_size 50M;
        limit_conn conn_limit 20; # Max 20 concurrent connections per IP

        # Global DevSecOps Hardened Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

        # Health check probe
        location /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"healthy","gateway":"nginx"}';
        }

        # 1. Express API Gateway Proxy
        location /api/v1/ {
            proxy_pass http://express_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering and timeouts for streaming response stabilization
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 2. WebSocket Real-time Media Chunk Proxy
        location /socket.io/ {
            proxy_pass http://express_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffers for real-time low-latency media streams
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 3. FastAPI AI Video & Conversational Speech Analysis Engine
        location /api/v1/analyze {
            limit_req zone=api_limit burst=5 nodelay; # Rate-limited endpoint

            proxy_pass http://ai_engine/api/v1/analyze;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Large timeouts to support deep video inference loops
            proxy_connect_timeout 180s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
    }
}
