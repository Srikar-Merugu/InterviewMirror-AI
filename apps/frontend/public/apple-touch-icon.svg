<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="36" fill="#0f172a"/>
  <rect width="180" height="180" rx="36" fill="url(#g)" opacity="0.06"/>
  <!-- Mirror icon -->
  <g transform="translate(90,85)">
    <!-- Top shape (person) -->
    <polygon points="0,-48 55,0 -55,0" fill="url(#g)" opacity="0.95"/>
    <!-- Bottom shape (reflection) -->
    <polygon points="0,48 55,0 -55,0" fill="url(#g2)" opacity="0.35"/>
    <!-- Mirror horizon line -->
    <rect x="-60" y="-3" width="120" height="6" rx="3" fill="#e2e8f0" opacity="0.7"/>
  </g>
  <!-- AI neural dots -->
  <circle cx="28" cy="28" r="6" fill="#06b6d4"/>
  <circle cx="152" cy="28" r="6" fill="#3b82f6" opacity="0.6"/>
  <circle cx="152" cy="152" r="6" fill="#2563eb" opacity="0.4"/>
  <circle cx="28" cy="152" r="6" fill="#06b6d4" opacity="0.3"/>
  <!-- Subtle ring -->
  <circle cx="90" cy="90" r="72" fill="none" stroke="url(#g)" stroke-width="1.5" opacity="0.12"/>
</svg>
